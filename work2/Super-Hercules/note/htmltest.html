<!DOCTYPE html>                     <!--用 DOCTYPE 定义了文档类型-->
<html>                  <!--其次最外层是 html 标签，最后还有对应的结束标签来表示闭合-->
  <head>                <!--网页头-->
    <meta charset="UTF-8" />      <!--指定了网页的编码为 UTF-8-->
    <title>This is a Demo</title>       <!--显示在网页的选项卡中，不会显示在正文中-->
  </head>
  <body>            <!--网页体，网页正文中显示的内容-->
    <div id="container">      <!--div标签定义了网页中的区块，它的id是container，id的内容在网页中是唯一的，可以通过它来获取这个区块-->
      <div class="wrapper">     <!--div常与CSS配合使用来设定样式-->
        <h2 class="title">泥嚎 世界</h2>        <!--代表一个二级标题-->
        <p class="text">泥嚎，我是一个段落。
        </p>     <!--代表一个段落-->
      </div>
    </div>

    <ol>            <!--ordered list有序标签-->
      <li>汉文</li>       <!--list item-->
      <li>洋文</li>
      <li>数学</li>
    </ol>

    <ul>            <!--unordered list无序标签-->
      <li>物理</li>
      <li>化学</li>
      <li>生物</li>
    </ul>

    <div>
      <table>       <!--列表-->
        <thead>
          <tr>
            <td>头部1</td>
            <td>头部2</td>
            <td>头部3</td>
          </tr>
        </thead>
        <tbody>
          <tr></tr>
          <tr></tr>
          <tr></tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
