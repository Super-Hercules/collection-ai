    <p data-first-child="">故宫历史悠久，自明永乐朝建成，经历无数风霜。在2025年的今天，去故宫游玩，可以发现古风街拍者多穿格格服，附近服装店也往往把格格服摆在最显眼的位置进行宣传，网络平台上全国各地年轻女性去故宫拍格格装成为风气。为何其他朝代的服饰如明汉服没有格格装这么流行？仅仅是因为清宫剧等文化作品的引导吗？
